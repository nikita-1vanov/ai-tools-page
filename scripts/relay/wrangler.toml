name = "ai-tools-feedback"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# С каких сайтов принимать форму (через запятую). Локальная сборка — добавить http://localhost:8080
ORIGINS = "https://tools.nikitaivanov.dev"

# Не больше 5 сообщений в минуту с одного IP
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Секреты задаются командой, в файл не пишутся:
#   wrangler secret put TG_TOKEN
#   wrangler secret put TG_CHAT
