<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Unbounded:wght@300;500;700&family=Schibsted+Grotesk:wght@700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Шаблон картинки превью 1200×630. Только RU (английская версия убрана 29.10.2026).
     Рендер: открыть в браузере с окном 1200×630 и сделать скриншот в assets/og-ru.png */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0E1014; }
  .og { position: relative; width: 1200px; height: 630px; color: #E9EBF0; font-family: Unbounded, sans-serif; overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none;
          background: radial-gradient(circle, rgba(140,162,255,.42) 0%, rgba(140,162,255,0) 22%), radial-gradient(circle, rgba(44,75,223,.75) 0%, rgba(44,75,223,.38) 24%, rgba(44,75,223,.12) 44%, transparent 66%); }
  .mark { font-family: "Archivo Black"; line-height: 1; letter-spacing: -.015em; color: transparent; -webkit-text-stroke: .045em #8CA2FF;
          filter: drop-shadow(0 0 10px rgba(140,162,255,.8)) drop-shadow(0 0 30px rgba(44,75,223,.7)); }
  h1 { font-weight: 700; letter-spacing: .02em; line-height: 1.05; }
  h1 .acc { color: #8CA2FF; }
  .tag { font-weight: 300; letter-spacing: .08em; text-transform: uppercase; color: #F5F5F5; }
  .by { display: flex; align-items: center; gap: 12px; color: #F5F5F5; }
  .by .n { font-family: "Schibsted Grotesk"; font-weight: 700; letter-spacing: .02em; font-size: 18px; }
  .by .r { font-family: "IBM Plex Mono"; font-size: 12px; letter-spacing: .1em; opacity: .55; }
</style>
</head>
<body>
<div class="og" id="og"></div>
<script>
  const p = new URLSearchParams(location.search);
  // Подзаголовок — как в SITE.tagline (tools.js); число сервисов подставить вручную
  const T = { tag: '138 нейросетей для текстов, картинок, видео, работы, кода и учёбы' };
  const ni = s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><g fill="currentColor"><rect x="6" y="8" width="16" height="84"/><polygon points="6,8 22,8 58,92 42,92"/><rect x="42" y="8" width="16" height="84"/><rect x="78" y="8" width="16" height="84"/></g></svg>`;
  const by = `<div class="by">${ni(30)}<div><div class="n">NIKITA IVANOV</div><div class="r">AI · ENGINEERING</div></div></div>`;

  // Утверждённый вариант: текст слева, знак AI справа
  const html = `<div class="glow" style="width:900px;height:900px;left:560px;top:-135px"></div>
        <div style="position:absolute;left:80px;top:150px;width:620px">
          <h1 style="font-size:66px">AI TOOLS:<br><span class="acc">BEST 2026</span></h1>
          <div class="tag" style="font-size:24px;margin-top:28px">${T.tag}</div>
        </div>
        <div class="mark" style="position:absolute;right:110px;top:180px;font-size:250px">AI</div>
        <div style="position:absolute;left:80px;bottom:60px">${by}</div>`;
  document.getElementById('og').innerHTML = html;
</script>
</body>
</html>
